<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel IPTV</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#fff;
}
button,input{
  font:inherit;
}
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:420px;
  background:#151b2e;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 40px #0008;
}
.logo{
  text-align:center;
  font-size:50px;
}
h1{
  text-align:center;
  margin:10px 0;
}
.sub{
  text-align:center;
  color:#9ca3af;
  margin-bottom:25px;
}
input{
  width:100%;
  padding:14px;
  margin:7px 0 14px;
  border:1px solid #374151;
  border-radius:10px;
  background:#0f172a;
  color:white;
  outline:none;
}
button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:bold;
}
.btn{
  width:100%;
  background:#7c3aed;
  color:white;
}
.btn:hover{background:#6d28d9}
.msg{
  margin-top:15px;
  text-align:center;
  color:#fca5a5;
}
.dashboard{
  display:none;
  min-height:100vh;
}
.top{
  background:#111827;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:5;
}
.top h2{margin:0}
.logout{
  background:#ef4444;
  color:white;
  padding:9px 13px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}
.stat{
  background:#151b2e;
  padding:18px;
  border-radius:14px;
}
.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}
.box{
  background:#151b2e;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}
.box h3{margin-top:0}
.formgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.formgrid input{
  margin:0;
}
.add{
  background:#22c55e;
  color:white;
  margin-top:10px;
}
.tablewrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px 8px;
  border-bottom:1px solid #293146;
  text-align:left;
  white-space:nowrap;
}
.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}
.ok{background:#14532d;color:#86efac}
.no{background:#7f1d1d;color:#fca5a5}
.action{
  padding:7px 9px;
  margin:2px;
}
.green{background:#16a34a;color:#fff}
.orange{background:#f59e0b;color:#111}
.red{background:#dc2626;color:#fff}
.link{
  color:#93c5fd;
  word-break:break-all;
  font-size:12px;
}
@media(max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .formgrid{grid-template-columns:1fr}
  .top h2{font-size:18px}
  .container{padding:12px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login" class="login">
  <div class="card">
    <div class="logo">📺</div>
    <h1>Painel IPTV</h1>
    <div class="sub">Acesso administrativo</div>

    <form id="loginForm">
      <input id="usuario" placeholder="Usuário" required>
      <input id="senha" type="password" placeholder="Senha" required>
      <button class="btn" type="submit">Entrar</button>
    </form>

    <div id="loginMsg" class="msg"></div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="dashboard">

  <header class="top">
    <h2>📺 Painel IPTV</h2>
    <button class="logout" onclick="logout()">Sair</button>
  </header>

  <main class="container">

    <div class="stats">
      <div class="stat">
        Clientes
        <strong id="totalClientes">0</strong>
      </div>

      <div class="stat">
        Ativos
        <strong id="clientesAtivos">0</strong>
      </div>

      <div class="stat">
        Vencidos
        <strong id="clientesVencidos">0</strong>
      </div>

      <div class="stat">
        Canais
        <strong id="totalCanais">0</strong>
      </div>
    </div>

    <!-- NOVO CLIENTE -->
    <div class="box">
      <h3>👤 Adicionar cliente</h3>

      <div class="formgrid">
        <input id="clienteNome" placeholder="Nome do cliente">
        <input id="clienteUsuario" placeholder="Usuário">
        <input id="clienteValidade" type="date">
      </div>

      <button class="add" onclick="adicionarCliente()">
        ➕ Adicionar cliente
      </button>
    </div>

    <!-- CLIENTES -->
    <div class="box">
      <h3>👥 Clientes</h3>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Usuário</th>
              <th>Validade</th>
              <th>Status</th>
              <th>M3U</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="clientesLista"></tbody>
        </table>
      </div>
    </div>
<!-- IMPORTAR XTREAM -->
<div class="box">
  <h3>📡 Importar Xtream Codes</h3>

  <input
    id="xtreamServidor"
    placeholder="Servidor (ex: http://servidor.com:8080)"
  >

  <input
    id="xtreamUsuario"
    placeholder="Usuário"
  >

  <input
    id="xtreamSenha"
    type="password"
    placeholder="Senha"
  >

  <button class="add" onclick="importarXtream()">
    📡 Importar Xtream
  </button>

  <p id="statusXtream"></p>
</div>
    <!-- NOVO CANAL -->
    <div class="box">
      <h3>📺 Adicionar canal</h3>

      <input id="canalNome" placeholder="Nome do canal">
      <input id="canalCategoria" placeholder="Categoria">
      <input id="canalUrl" placeholder="URL da transmissão">
      <input id="canalLogo" placeholder="URL da logo (opcional)">

      <button class="add" onclick="adicionarCanal()">
        ➕ Adicionar canal
      </button> 
      
<div class="box">
  <h3>📥 Importar playlist M3U</h3>

  <input
    type="file"
    id="arquivoM3U"
    accept=".m3u,.m3u8"
  >

  <button class="add" onclick="importarM3U()">
    📥 Importar M3U
  </button>

  <p id="statusM3U"></p>
</div>

</div>
</div> 
</div>
    

    <!-- CANAIS -->
    <div class="box">
      <h3>📡 Canais cadastrados</h3>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Canal</th>
              <th>Categoria</th>
              <th>Ação</th>
            </tr>
          </thead>

          <tbody id="canaisLista"></tbody>
        </table>
      </div>
    </div>

  </main>
</section>

<script>

let token = localStorage.getItem("iptv_token");

function headers(){
  return {
    "Content-Type":"application/json",
    "Authorization":"Bearer "+token
  };
}

function mostrarDashboard(){
  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";
  carregarTudo();
}
async function carregarTudo(){
  await Promise.all([
    carregarDashboard(),
    carregarClientes(),
    carregarCanais()
  ]);
}
function logout(){
  localStorage.removeItem("iptv_token");
  token=null;
  location.reload();
}

async function api(url,options={}){
  options.headers={
    ...headers(),
    ...(options.headers||{})
  };

  const r=await fetch(url,options);

  if(r.status===401){
    localStorage.removeItem("iptv_token");
    location.reload();
    return;
  }

  return r;
}

/* LOGIN */
document.getElementById("loginForm").addEventListener("submit",async function(e){

  e.preventDefault();

  const usuario=document.getElementById("usuario").value;
  const senha=document.getElementById("senha").value;
  const msg=document.getElementById("loginMsg");

  msg.textContent="Entrando...";

  try{

    const r=await fetch("/api/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        username:usuario,
        password:senha
      })
    });

    const data=await r.json();

    if(!r.ok){
      msg.textContent=data.error||"Usuário ou senha inválidos.";
      return;
    }

    localStorage.setItem("iptv_token",data.token);
    token=data.token;

    mostrarDashboard();

  }catch(e){
    msg.textContent="Erro ao conectar ao servidor.";
  }

});

/* DASHBOARD */
async function carregarDashboard(){

  const r=await api("/api/dashboard");

  if(!r)return;

  const d=await r.json();

  document.getElementById("totalClientes").textContent=d.clients;
  document.getElementById("clientesAtivos").textContent=d.active;
  document.getElementById("clientesVencidos").textContent=d.expired;
  document.getElementById("totalCanais").textContent=d.channels;
}

/* CLIENTES */
async function carregarClientes(){

  const r=await api("/api/clients");

  if(!r)return;

  const clientes=await r.json();
  const lista=document.getElementById("clientesLista");

  lista.innerHTML="";

  clientes.forEach(c=>{

    const ativo=c.active && new Date(c.expiresAt+"T23:59:59")>=new Date();

    const link=location.origin+"/playlist/"+c.token+".m3u";

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${c.name}</td>
      <td>${c.username}</td>
      <td>${c.expiresAt}</td>
      <td>
        <span class="badge ${ativo?"ok":"no"}">
          ${ativo?"ATIVO":"BLOQUEADO/VENCIDO"}
        </span>
      </td>
      <td>
        <button class="action green" onclick="copiar('${link}')">
          🔗 Copiar
        </button>
      </td>
      <td>
        <button class="action ${c.active?"orange":"green"}"
          onclick="alternarCliente('${c.id}',${!c.active})">
          ${c.active?"Bloquear":"Ativar"}
        </button>

        <button class="action red"
          onclick="excluirCliente('${c.id}')">
          Excluir
        </button>
      </td>
    `;

    lista.appendChild(tr);
  });
}

/* ADICIONAR CLIENTE */
async function adicionarCliente(){

  const name=document.getElementById("clienteNome").value.trim();
  const username=document.getElementById("clienteUsuario").value.trim();
  const expiresAt=document.getElementById("clienteValidade").value;

  if(!name||!username||!expiresAt){
    alert("Preencha nome, usuário e validade.");
    return;
  }

  const r=await api("/api/clients",{
    method:"POST",
    body:JSON.stringify({
      name,
      username,
      expiresAt
    })
  });

  if(!r)return;

  const data=await r.json();

  if(!r.ok){
    alert(data.error||"Erro ao criar cliente.");
    return;
  }

  document.getElementById("clienteNome").value="";
  document.getElementById("clienteUsuario").value="";
  document.getElementById("clienteValidade").value="";

  alert("Cliente criado com sucesso!");

  carregarTudo();
}

/* ATIVAR/BLOQUEAR */
async function alternarCliente(id,active){

  const r=await api("/api/clients/"+id,{
    method:"PATCH",
    body:JSON.stringify({active})
  });

  if(r && r.ok){
    carregarTudo();
  }
}

/* EXCLUIR CLIENTE */
async function excluirCliente(id){

  if(!confirm("Deseja excluir este cliente?"))return;

  const r=await api("/api/clients/"+id,{
    method:"DELETE"
  });

  if(r && r.ok){
    carregarTudo();
  }
}

/* CANAIS */
async function carregarCanais(){

  const r=await api("/api/channels");

  if(!r)return;

  const canais=await r.json();
  const lista=document.getElementById("canaisLista");

  lista.innerHTML="";

  canais.forEach(c=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${c.name}</td>
      <td>${c.category||"Geral"}</td>
      <td>
        <button class="action red"
          onclick="excluirCanal('${c.id}')">
          Excluir
        </button>
      </td>
    `;

    lista.appendChild(tr);
  });
}

/* ADICIONAR CANAL */
async function adicionarCanal(){

  const name=document.getElementById("canalNome").value.trim();
  const category=document.getElementById("canalCategoria").value.trim();
  const url=document.getElementById("canalUrl").value.trim();
  const logo=document.getElementById("canalLogo").value.trim();

  if(!name||!url){
    alert("Informe o nome e a URL do canal.");
    return;
  }
  const r=await api("/api/channels",{
    method:"POST",
    body:JSON.stringify({
      name,
      category,
      url,
      logo
    })
  });

  if(!r)return;

  const data=await r.json();

  if(!r.ok){
    alert(data.error||"Erro ao criar canal.");
    return;
  }
  document.getElementById("canalNome").value="";
  document.getElementById("canalCategoria").value="";
  document.getElementById("canalUrl").value="";
  document.getElementById("canalLogo").value="";

  alert("Canal adicionado!");

  carregarTudo();
}

/* EXCLUIR CANAL */
async function excluirCanal(id){

  if(!confirm("Deseja excluir este canal?"))return;

  const r=await api("/api/channels/"+id,{
    method:"DELETE"
  });

  if(r && r.ok){
    carregarTudo();
  }
  }
async function importarM3U(){
  const input = document.getElementById("arquivoM3U");
  const status = document.getElementById("statusM3U");

  if(!input.files.length){
    alert("Escolha um arquivo M3U.");
    return;
  }

  status.textContent = "Lendo playlist...";

  try{
    const content = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(reader.error);

      reader.readAsText(input.files[0]);
    });

    const regex = /#EXTINF[^\r\n]*(?:\r\n|\n|\r)[^\r\n]+/g;
    const lotes = [];
    let match;
    let lote = [];

    while((match = regex.exec(content)) !== null){
      lote.push(match[0]);

      if(lote.length >= 500){
        lotes.push(lote);
        lote = [];
      }
    }

    if(lote.length){
      lotes.push(lote);
    }

    if(!lotes.length){
      status.textContent = "Nenhum canal encontrado no arquivo M3U.";
      return;
    }

    let totalImportado = 0;

    for(let i = 0; i < lotes.length; i++){
      status.textContent =
        `Importando lote ${i + 1} de ${lotes.length}...`;

      const loteM3U = "#EXTM3U\n" + lotes[i].join("\n");

      const r = await api("/api/import-m3u", {
        method: "POST",
        body: JSON.stringify({
          content: loteM3U,
        final: i === lotes.length - 1
       })
      });

      const data = await r.json();

      if(!r.ok){
        status.textContent =
          data.error || "Erro ao importar lote.";
        return;
      }

      totalImportado += Number(data.imported || 0);
    }

    status.textContent =
      `${totalImportado} canais importados com sucesso!`;

    input.value = "";
    carregarTudo();

  }catch(e){
    status.textContent =
      "Erro: " + (e.message || e);
  }
async function importarXtream(){

  const servidor = document
    .getElementById("xtreamServidor")
    .value.trim();

  const username = document
    .getElementById("xtreamUsuario")
    .value.trim();

  const password = document
    .getElementById("xtreamSenha")
    .value.trim();

  const status = document.getElementById("statusXtream");

  if(!servidor || !username || !password){
    alert("Preencha servidor, usuário e senha.");
    return;
  }

  status.textContent = "📡 Conectando ao servidor...";

  try {

    const r = await api("/api/import-xtream", {
      method: "POST",
      body: JSON.stringify({
        server: servidor,
        username: username,
        password: password
      })
    });

    if(!r){
      return;
    }

    const data = await r.json();

    if(!r.ok){
      status.textContent =
        "❌ " + (data.error || "Erro ao importar Xtream.");
      return;
    }

    status.textContent =
      `✅ ${data.imported || 0} canais importados com sucesso!`;

    carregarTudo();

  } catch(e) {

    console.error(e);

    status.textContent =
      "❌ Erro: " + (e.message || e);
  }
}
  async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    alert("Link M3U copiado!");
  } catch (e) {
    alert("Não foi possível copiar o link.");
  }
}

</script>

</body>
</html>
